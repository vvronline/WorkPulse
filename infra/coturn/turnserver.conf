# ─────────────────────────────────────────────────────────────────────────────
# coturn configuration for WorkPulse
# ─────────────────────────────────────────────────────────────────────────────
# This config is tuned for two real-world failure modes:
#   1. Corporate proxies that block UDP and only allow outbound 443/HTTPS
#       → we expose TURN over TLS on port 443 (`tls-listening-port=443`)
#         which looks indistinguishable from an HTTPS connection.
#   2. Mobile networks with carrier-grade NAT / symmetric NAT
#       → STUN can't bind a useful relay; TURN does the relay.
#
# Auth uses the time-limited HMAC REST API (no per-user passwords).
# The server signs ephemeral usernames using `static-auth-secret`. The
# Node API computes the same HMAC in server/utils/coturn.js.
# Reference: https://github.com/coturn/coturn/blob/master/README.turnserver
# ─────────────────────────────────────────────────────────────────────────────

# Listening interfaces — bind to all by default; restrict in production.
listening-port=3478
tls-listening-port=5349
# Enable TURN-over-TLS on 443 so corporate firewalls let it through.
alt-tls-listening-port=443

# Min/max relay UDP ports — keep this range narrow so you only need to open a
# few thousand ports on the host firewall instead of the entire ephemeral range.
min-port=49152
max-port=49200

# External advertised IP (set via env in docker-compose). When running behind
# NAT / cloud LB, you MUST set this to the publicly reachable IP, otherwise
# the candidates coturn hands out will not be routable.
# external-ip=YOUR_PUBLIC_IP/INTERNAL_IP

# Realm — must match what your app advertises (informational; clients ignore).
realm=workpulse

# ─── Auth ────────────────────────────────────────────────────────────────────
# Use HMAC REST API: server signs ephemeral creds using the shared secret.
# Replace the placeholder via $TURN_STATIC_AUTH_SECRET at runtime.
use-auth-secret
static-auth-secret=__REPLACE_WITH_TURN_STATIC_AUTH_SECRET__

# ─── TLS certificates (required for turns:// and 443 endpoints) ─────────────
# Mount a Let's Encrypt cert + key into the container at these paths.
# In the bundled docker-compose we use a self-signed dev cert as a fallback so
# the service starts; replace with real certs in production.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
# Modern cipher suite — keep in sync with your TLS termination policy.
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20"
no-tlsv1
no-tlsv1_1

# ─── Hardening ──────────────────────────────────────────────────────────────
# Drop loopback and link-local addresses from candidate replies; coturn must
# never relay to / from internal hosts.
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-fe80::ffff:ffff:ffff:ffff
# But explicitly allow Docker's default bridge so peers can still hit each
# other through coturn when running on the same host (uncomment to enable):
# allowed-peer-ip=172.17.0.0-172.17.255.255

# Limit total bandwidth to protect the box from abuse (in bytes/sec).
# 0 = unlimited; tune based on your egress capacity.
total-quota=0
user-quota=0
max-bps=0

# Drop privileges after binding privileged ports.
proc-user=turnserver
proc-group=turnserver

# ─── Logging ────────────────────────────────────────────────────────────────
# stdout so docker logs / k8s logs collect everything.
log-file=stdout
no-stdout-log
verbose
fingerprint
lt-cred-mech
no-cli