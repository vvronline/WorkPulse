# Phase H1 — example Prometheus scrape configuration for the three roles.
#
# Railway does not expose a service-discovery API, so targets are static. Each
# service keeps its own job name; that is what the `job=~"aino-.*"` matcher in
# alerts.yml relies on.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: aino-web
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      # Same value as the METRICS_TOKEN variable on the Railway service.
      credentials_file: /etc/prometheus/aino-metrics-token
    static_configs:
      - targets: ["www.aino.org.in"]
        labels:
          service: aino-web

  - job_name: aino-realtime
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/aino-metrics-token
    static_configs:
      - targets: ["realtime.aino.org.in"]
        labels:
          service: aino-realtime

  # The worker serves no public traffic. Scrape it over the Railway private
  # network rather than giving it a public domain purely for metrics.
  - job_name: aino-worker
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/aino-metrics-token
    static_configs:
      - targets: ["aino-worker.railway.internal:5000"]
        labels:
          service: aino-worker
