name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ── Server ──────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck server
        working-directory: server
        run: npm run typecheck

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Run server tests
        working-directory: server
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: npm test

      # ── Client ──────────────────────────────────
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Typecheck client
        working-directory: client
        run: npm run typecheck

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      # Fails the build on ESLint ERRORS only. Warnings (the pre-existing
      # `as any` / empty-catch / console debt) are reported but non-blocking,
      # so the ratchet can be tightened as that debt is paid down.
      - name: Lint mobile
        working-directory: mobile
        run: npm run lint

      - name: Typecheck mobile (app)
        working-directory: mobile
        run: npm run typecheck

      - name: Typecheck mobile (tests)
        working-directory: mobile
        run: npm run typecheck:tests

      - name: Run mobile tests
        working-directory: mobile
        run: npm run test:ci

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t workpulse:${{ github.sha }} .
