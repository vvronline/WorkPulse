name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ── Server ──────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: npm test

      # ── Client ──────────────────────────────────
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t workpulse:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }} --detach

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -L --max-time 10 \
              "https://${{ secrets.RAILWAY_APP_DOMAIN }}/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ App is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ App did not become healthy after 180s"
          exit 1
