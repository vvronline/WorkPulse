name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ── Server ──────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: npm test

      # ── Client ──────────────────────────────────
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t workpulse:${{ github.sha }} .

  verify-deployment:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Wait for Railway to deploy and verify health
        run: |
          echo "Waiting for Railway deployment to become healthy..."
          sleep 60
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -L --max-time 10 \
              "https://${{ secrets.RAILWAY_APP_DOMAIN }}/api/health" || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "✅ App is responding (HTTP $STATUS) on attempt $i"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "❌ App did not respond after 3 minutes"
          exit 1
