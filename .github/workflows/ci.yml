name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ── Server ──────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        env:
          JWT_SECRET: ci-test-secret
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: npm test

      # ── Client ──────────────────────────────────
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t workpulse:${{ github.sha }} .

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCE
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_INSTANCE_NAME }} \
            --zone=${{ secrets.GCP_ZONE }} \
            --ssh-flag="-o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3" \
            --command="
              set -e
              cd ~/WorkPulse
              git fetch origin master
              git reset --hard origin/master
              docker-compose down --remove-orphans
              docker-compose build --no-cache
              docker-compose up -d
            " \
            --quiet

      - name: Wait for app to be healthy
        run: |
          echo "Waiting for app to start..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -L --insecure --max-time 10 \
              "http://35.239.116.119/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ App is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "❌ App did not become healthy after 180s"
          exit 1
