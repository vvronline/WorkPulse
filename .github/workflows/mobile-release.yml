name: Mobile Release

# Builds a signed Android APK with Expo prebuild + Gradle and attaches it to a
# GitHub release. Triggered by tags of the form `mobile-vX.Y.Z` so it never
# collides with the desktop release workflow (which uses `vX.Y.Z`).
#
# The native `mobile/android` project is gitignored (it is generated by
# `expo prebuild`), so CI regenerates it on every run. The APK is signed with
# the Expo-generated debug keystore — this is fine for internal / sideload
# distribution (which is how the desktop builds are distributed too).
#
# NOTE: To ship a Play-Store / production-signed APK you must configure signing
# in a way that survives `expo prebuild`, e.g. an Expo config plugin or
# `app.config.ts` that injects a release signingConfig (the generated
# build.gradle currently signs `release` with `signingConfigs.debug`). Wiring a
# keystore via gradle.properties alone would NOT take effect because prebuild
# overwrites build.gradle on every run.

on:
  push:
    tags:
      - 'mobile-v*' # e.g. mobile-v1.0.0, mobile-v1.2.3

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate tag matches mobile/package.json version
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/mobile-v}"
          PKG_VERSION=$(node -p "require('./mobile/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match mobile/package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      # Backend targets baked into the JS bundle at build time. Override here (or
      # via repo variables) if you ever ship a build pointing at a different API.
      EXPO_PUBLIC_API_BASE_URL: https://workpulse-prod.up.railway.app/api
      EXPO_PUBLIC_WS_BASE_URL: wss://workpulse-prod.up.railway.app
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      # app.config.ts references android.googleServicesFile: "./google-services.json".
      # The file is gitignored / not committed (it carries the FCM sender config),
      # so we materialize it from the repo secret before prebuild. Without this the
      # @react-native-firebase config plugins fail and FCM background/terminated
      # push delivery (incoming calls + message status-bar notifications) breaks.
      - name: Write google-services.json from secret
        working-directory: mobile
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "::error::ANDROID_GOOGLE_SERVICES_JSON secret is empty — Firebase Cloud Messaging will not be configured"
            exit 1
          fi
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > google-services.json
          # Fail fast if the secret is not valid JSON.
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8')); console.log('google-services.json written and valid')"

      - name: Expo prebuild (generate native android project)
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # Key on the lockfile (stable across prebuild) so the cache actually
          # hits — android/*.gradle is regenerated by prebuild on every run.
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Cache the native C++/CMake build outputs (Hermes, Fabric, TurboModules).
      # These dominate the build time and are not covered by the Gradle cache.
      - name: Cache native build (.cxx + RN codegen)
        uses: actions/cache@v4
        with:
          path: |
            mobile/android/app/.cxx
            mobile/android/app/build/generated
            ~/.gradle/caches/transforms-3
          key: ${{ runner.os }}-rn-native-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-rn-native-

      - name: Build release APK
        working-directory: mobile/android
        env:
          # Only build for 64-bit ARM (real devices / sideload). Dropping
          # armeabi-v7a + x86 + x86_64 avoids compiling the native layer
          # (Hermes/Fabric/TurboModules) 4× — the main reason builds took ~26m.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
        run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a

      - name: Stage APK with versioned name
        id: stage
        shell: bash
        working-directory: mobile
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected APK not found at $SRC"
            find android/app/build/outputs -name '*.apk' || true
            exit 1
          fi
          mkdir -p ../release-assets
          OUT="../release-assets/WorkPulse-${VERSION}.apk"
          cp "$SRC" "$OUT"
          echo "Staged $OUT"
          ls -la ../release-assets/

      - name: Generate checksum
        shell: bash
        working-directory: release-assets
        run: |
          echo "## Checksums (SHA-256)" > checksums.txt
          for f in *.apk; do
            [ -f "$f" ] && sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: release-assets/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: mobile-apk
          path: release-assets

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Find the previous mobile tag (skip the current one).
          PREV_TAG=$(git tag --sort=-creatordate | grep '^mobile-v' | sed -n '2p')

          NOTES="## WorkPulse Mobile v${VERSION}\n\n"

          if [ -n "$PREV_TAG" ]; then
            NOTES+="### Changes since ${PREV_TAG}\n\n"
            FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^feat" --no-merges 2>/dev/null || true)
            FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^fix" --no-merges 2>/dev/null || true)
            OTHER=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --invert-grep --grep="^feat" --grep="^fix" --no-merges 2>/dev/null | head -20 || true)

            if [ -n "$FEATURES" ]; then
              NOTES+="### ✨ Features\n${FEATURES}\n\n"
            fi
            if [ -n "$FIXES" ]; then
              NOTES+="### 🐛 Bug Fixes\n${FIXES}\n\n"
            fi
            if [ -n "$OTHER" ]; then
              NOTES+="### 📝 Other Changes\n${OTHER}\n\n"
            fi
          fi

          NOTES+="### 📲 Installation\n"
          NOTES+="Download \`WorkPulse-${VERSION}.apk\` below and install it on your Android device (you may need to allow installs from unknown sources).\n\n"

          NOTES+="### 🔒 Checksums (SHA-256)\n\`\`\`\n"
          if [ -f release-assets/checksums.txt ]; then
            NOTES+="$(cat release-assets/checksums.txt)\n"
          fi
          NOTES+="\`\`\`\n"

          echo -e "$NOTES" > release-notes.md
          cat release-notes.md

      - name: Create or find the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          RELEASE_ID=""
          TMP=$(mktemp)
          if gh api "repos/${{ github.repository }}/releases/tags/mobile-v${VERSION}" >"$TMP" 2>/dev/null; then
            RELEASE_ID=$(jq -r '.id // empty' <"$TMP")
            echo "Reusing existing release id=${RELEASE_ID} for mobile-v${VERSION} (via tag lookup)"
          else
            RELEASE_ID=$(gh api --paginate "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"mobile-v${VERSION}\") | .id" | head -1)
            if [ -n "$RELEASE_ID" ]; then
              echo "Reusing existing draft release id=${RELEASE_ID} for mobile-v${VERSION} (via list)"
            fi
          fi
          rm -f "$TMP"

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating fresh draft release for mobile-v${VERSION}"
            RELEASE_ID=$(gh api -X POST \
              "repos/${{ github.repository }}/releases" \
              -f tag_name="mobile-v${VERSION}" \
              -f name="Mobile v${VERSION}" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')
            echo "Created release id=${RELEASE_ID}"
          fi

          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Got non-numeric RELEASE_ID='${RELEASE_ID}' for mobile-v${VERSION}"
            exit 1
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          if gh api -X PATCH \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -F body=@release-notes.md; then
            echo "Updated release notes"
          else
            echo "::warning::Failed to update release notes (id=${RELEASE_ID}); continuing"
          fi

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          shopt -s nullglob
          FILES=(release-assets/*.apk)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No APK found to upload"
            exit 1
          fi

          EXISTING=$(gh api --paginate \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | "\(.id)\t\(.name)"' || true)

          urlencode() { jq -rn --arg v "$1" '$v|@uri'; }

          FAIL=0
          for f in "${FILES[@]}"; do
            name=$(basename "$f")
            existing_id=$(echo "$EXISTING" | awk -F'\t' -v n="$name" '$2 == n { print $1; exit }')
            if [ -n "$existing_id" ]; then
              echo "Deleting existing asset id=${existing_id} name=${name}"
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${existing_id}" || true
            fi

            encoded_name=$(urlencode "$name")
            echo "Uploading ${name}..."
            HTTP_CODE=$(curl -sS -o /tmp/upload-resp.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${encoded_name}")
            if [ "$HTTP_CODE" != "201" ]; then
              echo "::error::Failed to upload ${name} (HTTP ${HTTP_CODE})"
              cat /tmp/upload-resp.json || true
              echo
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::APK upload failed"
            exit 1
          fi

          echo "Final asset list on release:"
          gh api --paginate \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | {name, size, download_count}'

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No RELEASE_ID was passed in from the create-or-find step"
            exit 1
          fi
          echo "Publishing release id=${RELEASE_ID} for mobile-v${VERSION}"
          if gh api \
              -X PATCH \
              "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              -f tag_name="mobile-v${VERSION}" \
              -f name="Mobile v${VERSION}" \
              -F draft=false; then
            echo "Published release mobile-v${VERSION} (id=${RELEASE_ID})"
            exit 0
          fi
          echo "::error::Failed to publish release mobile-v${VERSION} (id=${RELEASE_ID})"
          exit 1