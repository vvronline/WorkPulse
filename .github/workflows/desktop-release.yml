name: Desktop Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v1.2.3

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches package.json version
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build-client:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client for Electron
        working-directory: client
        env:
          VITE_WS_URL: wss://workpulse-prod.up.railway.app/ws
          VITE_ELECTRON: 'true'
        run: npm run build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  prepare-release:
    needs: [validate, build-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and release on releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Create the tag on WorkPulse-releases so electron-builder can publish against it
          # First check if tag already exists
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/vvronline/WorkPulse-releases/git/ref/tags/v${VERSION}")
          if [ "$STATUS" != "200" ]; then
            # Get the default branch SHA to anchor the tag
            DEFAULT_SHA=$(curl -s \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/vvronline/WorkPulse-releases/git/ref/heads/main" \
              | jq -r '.object.sha // empty')
            if [ -z "$DEFAULT_SHA" ]; then
              DEFAULT_SHA=$(curl -s \
                -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/vvronline/WorkPulse-releases/git/ref/heads/master" \
                | jq -r '.object.sha // empty')
            fi
            if [ -z "$DEFAULT_SHA" ]; then
              echo "::error::Could not find default branch SHA on WorkPulse-releases"
              exit 1
            fi
            # Create a lightweight tag
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/vvronline/WorkPulse-releases/git/refs" \
              -d "{\"ref\": \"refs/tags/v${VERSION}\", \"sha\": \"${DEFAULT_SHA}\"}"
            echo "Created tag v${VERSION} on WorkPulse-releases"
          else
            echo "Tag v${VERSION} already exists on WorkPulse-releases"
          fi

          # Build initial release notes from git log so electron-updater has content immediately
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p' || true)
          BODY="## WorkPulse Desktop v${VERSION}\n\n"
          if [ -n "$PREV_TAG" ]; then
            FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^feat" --no-merges 2>/dev/null || true)
            FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^fix" --no-merges 2>/dev/null || true)
            if [ -n "$FEATURES" ]; then BODY+="### ✨ Features\n${FEATURES}\n\n"; fi
            if [ -n "$FIXES" ]; then BODY+="### 🐛 Bug Fixes\n${FIXES}\n\n"; fi
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ]; then
              COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges 2>/dev/null | head -10 || true)
              if [ -n "$COMMITS" ]; then BODY+="### Changes\n${COMMITS}\n\n"; fi
            fi
          fi
          BODY_JSON=$(echo -e "$BODY" | jq -Rs '.')

          # Create a release so parallel electron-builder jobs don't race to create one
          RELEASE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/vvronline/WorkPulse-releases/releases/tags/v${VERSION}")
          if [ "$RELEASE_STATUS" != "200" ]; then
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/vvronline/WorkPulse-releases/releases" \
              -d "{\"tag_name\": \"v${VERSION}\", \"name\": \"v${VERSION}\", \"body\": $BODY_JSON, \"draft\": false, \"prerelease\": false}"
            echo "Created release v${VERSION} on WorkPulse-releases with notes"
          else
            echo "Release v${VERSION} already exists on WorkPulse-releases"
          fi

  build:
    needs: [validate, build-client, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Electron app
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: npx electron-builder ${{ matrix.args }} --publish always

      - name: Generate checksums
        shell: bash
        working-directory: desktop/dist
        run: |
          echo "## Checksums (SHA-256)" > checksums.txt
          for f in *.exe *.dmg *.AppImage *.deb *.zip *.blockmap *.yml *.yaml; do
            [ -f "$f" ] && sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.os }}
          path: desktop/dist/checksums.txt
          retention-days: 30

  release-notes:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all checksums
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: checksums

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')
          
          NOTES="## WorkPulse Desktop v${VERSION}\n\n"
          
          if [ -n "$PREV_TAG" ]; then
            NOTES+="### Changes since ${PREV_TAG}\n\n"
            # Group commits by type
            FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^feat" --no-merges 2>/dev/null || true)
            FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^fix" --no-merges 2>/dev/null || true)
            OTHER=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --invert-grep --grep="^feat" --grep="^fix" --no-merges 2>/dev/null | head -20 || true)
            
            if [ -n "$FEATURES" ]; then
              NOTES+="### ✨ Features\n${FEATURES}\n\n"
            fi
            if [ -n "$FIXES" ]; then
              NOTES+="### 🐛 Bug Fixes\n${FIXES}\n\n"
            fi
            if [ -n "$OTHER" ]; then
              NOTES+="### 📝 Other Changes\n${OTHER}\n\n"
            fi
          fi
          
          # Append checksums
          NOTES+="### 🔒 Checksums (SHA-256)\n\`\`\`\n"
          for f in checksums/checksums-*/checksums.txt; do
            if [ -f "$f" ]; then
              NOTES+="$(cat "$f")\n"
            fi
          done
          NOTES+="\`\`\`\n"
          
          # Write to file for the GitHub release
          echo -e "$NOTES" > release-notes.md
          cat release-notes.md

      - name: Update release notes on releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/vvronline/WorkPulse-releases/releases/tags/v${VERSION}" \
            | jq -r '.id // empty')
          
          if [ -n "$RELEASE_ID" ]; then
            BODY=$(jq -Rs '.' < release-notes.md)
            curl -s -X PATCH \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/vvronline/WorkPulse-releases/releases/${RELEASE_ID}" \
              -d "{\"body\": $BODY}"
            echo "Updated release notes for v${VERSION}"
          else
            echo "Release v${VERSION} not found yet, skipping notes update"
          fi
