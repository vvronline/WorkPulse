name: Desktop Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v1.2.3

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches package.json version
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build-client:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client for Electron
        working-directory: client
        env:
          VITE_WS_URL: wss://workpulse-prod.up.railway.app/ws
          VITE_ELECTRON: 'true'
        run: npm run build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  build:
    needs: [validate, build-client]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # ──────────────────────────────────────────────────────────────────────
      # Cache the electron binary downloads (and app-builder helper binaries)
      # so that flaky 502s from github.com/electron/electron/releases/download
      # don't fail the build on every retry. The cache key includes the
      # electron version so a version bump invalidates the cache automatically.
      # ──────────────────────────────────────────────────────────────────────
      - name: Read electron version
        id: electron_ver
        shell: bash
        working-directory: desktop
        run: |
          EV=$(node -p "require('electron/package.json').version")
          echo "version=$EV" >> "$GITHUB_OUTPUT"
          echo "Electron version: $EV"

      - name: Cache electron binaries (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ steps.electron_ver.outputs.version }}-v2
          restore-keys: |
            ${{ runner.os }}-electron-${{ steps.electron_ver.outputs.version }}-
            ${{ runner.os }}-electron-

      - name: Cache electron binaries (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ steps.electron_ver.outputs.version }}-v2
          restore-keys: |
            ${{ runner.os }}-electron-${{ steps.electron_ver.outputs.version }}-
            ${{ runner.os }}-electron-

      # IMPORTANT: do NOT pass GH_TOKEN to this step — we don't want electron-builder
      # to publish directly. When it does, parallel matrix jobs each create their OWN
      # duplicate draft release (named "1.4.x" without the "v" prefix) that they
      # can't find via /releases/tags/{tag}, scattering assets across 3-4 duplicate
      # drafts. Instead we collect artifacts and upload them all once from the single
      # release-notes job below, against a release WE control.
      #
      # The retry loop guards against transient 502s from
      # github.com/electron/electron/releases/download/... which periodically
      # bombs out and kills the macOS leg of the build.
      - name: Build Electron app (with retries)
        shell: bash
        working-directory: desktop
        env:
          # Quiet down electron-builder native dependency rebuild noise on CI
          USE_HARD_LINKS: 'false'
        run: |
          set -e
          MAX_ATTEMPTS=4
          ATTEMPT=1
          until [ "$ATTEMPT" -gt "$MAX_ATTEMPTS" ]; do
            echo "── electron-builder attempt ${ATTEMPT}/${MAX_ATTEMPTS} ──"
            if npx electron-builder ${{ matrix.args }} --publish never; then
              echo "Build succeeded on attempt ${ATTEMPT}"
              exit 0
            fi
            EXIT=$?
            echo "::warning::electron-builder failed on attempt ${ATTEMPT} (exit ${EXIT})"
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::electron-builder failed after ${MAX_ATTEMPTS} attempts"
              exit "$EXIT"
            fi
            SLEEP=$(( ATTEMPT * 30 ))
            echo "Sleeping ${SLEEP}s before retry…"
            sleep "$SLEEP"
            ATTEMPT=$(( ATTEMPT + 1 ))
          done

      - name: Generate checksums
        shell: bash
        working-directory: desktop/dist
        run: |
          echo "## Checksums (SHA-256)" > checksums.txt
          for f in *.exe *.dmg *.AppImage *.deb *.zip *.blockmap *.yml *.yaml; do
            [ -f "$f" ] && sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.os }}
          path: desktop/dist/checksums.txt
          retention-days: 30

      - name: Stage installers for upload
        shell: bash
        working-directory: desktop/dist
        run: |
          # Collect only the files that need to be on the GitHub release. We deliberately
          # exclude the unpacked app bundles (linux-unpacked/, win-unpacked/, mac/, etc.)
          # which are huge and not needed by electron-updater.
          mkdir -p ../../release-assets/${{ matrix.os }}
          shopt -s nullglob
          for f in *.exe *.exe.blockmap \
                   *.dmg *.dmg.blockmap *.zip *.zip.blockmap \
                   *.AppImage *.deb \
                   latest.yml latest-mac.yml latest-linux.yml; do
            if [ -f "$f" ]; then
              cp "$f" "../../release-assets/${{ matrix.os }}/"
              echo "Staged: $f"
            fi
          done
          echo "---"
          echo "Total staged files:"
          ls -la "../../release-assets/${{ matrix.os }}/"

      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: release-assets/${{ matrix.os }}/
          retention-days: 7
          if-no-files-found: error

  release-notes:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all checksums
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: checksums

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')

          NOTES="## WorkPulse Desktop v${VERSION}\n\n"

          if [ -n "$PREV_TAG" ]; then
            NOTES+="### Changes since ${PREV_TAG}\n\n"
            # Group commits by type
            FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^feat" --no-merges 2>/dev/null || true)
            FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^fix" --no-merges 2>/dev/null || true)
            OTHER=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --invert-grep --grep="^feat" --grep="^fix" --no-merges 2>/dev/null | head -20 || true)

            if [ -n "$FEATURES" ]; then
              NOTES+="### ✨ Features\n${FEATURES}\n\n"
            fi
            if [ -n "$FIXES" ]; then
              NOTES+="### 🐛 Bug Fixes\n${FIXES}\n\n"
            fi
            if [ -n "$OTHER" ]; then
              NOTES+="### 📝 Other Changes\n${OTHER}\n\n"
            fi
          fi

          # Append checksums
          NOTES+="### 🔒 Checksums (SHA-256)\n\`\`\`\n"
          for f in checksums/checksums-*/checksums.txt; do
            if [ -f "$f" ]; then
              NOTES+="$(cat "$f")\n"
            fi
          done
          NOTES+="\`\`\`\n"

          # Write to file for the GitHub release
          echo -e "$NOTES" > release-notes.md
          cat release-notes.md

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: List downloaded installers
        run: |
          echo "Files staged for upload to v${{ needs.validate.outputs.version }}:"
          ls -la installers/ || true
          echo "Total size:"
          du -sh installers/ || true

      - name: Clean up any duplicate / orphaned drafts for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Previous runs of this workflow (when electron-builder --publish always was
          # racing) left behind duplicate draft releases named "${VERSION}" (no v) and
          # "v${VERSION}" with overlapping/missing assets. Delete every draft that
          # references this version so we start from a clean slate.
          DRAFTS=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq ".[] | select(.draft == true) | select(.tag_name == \"v${VERSION}\" or .name == \"v${VERSION}\" or .name == \"${VERSION}\") | .id")
          if [ -z "$DRAFTS" ]; then
            echo "No leftover drafts for v${VERSION}"
          else
            for id in $DRAFTS; do
              echo "Deleting orphan draft id=${id}"
              gh api -X DELETE "repos/${{ github.repository }}/releases/${id}" || true
            done
          fi

      - name: Create or find the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # If a release for this tag already exists (published OR draft), reuse it.
          # Otherwise create one as draft so the upload step below can populate it
          # before we flip it live.
          #
          # IMPORTANT: `gh api` writes the raw response body to stdout on HTTP errors
          # (e.g. 404) and does NOT apply --jq in that case. Capturing without
          # checking the exit code would put a JSON error blob into RELEASE_ID and
          # poison every subsequent API call. So we run gh api into a tempfile,
          # check the exit code explicitly, and only then parse out .id.
          RELEASE_ID=""
          TMP=$(mktemp)
          if gh api "repos/${{ github.repository }}/releases/tags/v${VERSION}" >"$TMP" 2>/dev/null; then
            RELEASE_ID=$(jq -r '.id // empty' <"$TMP")
            echo "Reusing existing release id=${RELEASE_ID} for v${VERSION} (via tag lookup)"
          else
            # Tag lookup only finds PUBLISHED releases. Draft releases must be
            # discovered via the list endpoint.
            RELEASE_ID=$(gh api --paginate "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id" | head -1)
            if [ -n "$RELEASE_ID" ]; then
              echo "Reusing existing draft release id=${RELEASE_ID} for v${VERSION} (via list)"
            fi
          fi
          rm -f "$TMP"

          if [ -z "$RELEASE_ID" ]; then
            echo "Creating fresh draft release for v${VERSION}"
            RELEASE_ID=$(gh api -X POST \
              "repos/${{ github.repository }}/releases" \
              -f tag_name="v${VERSION}" \
              -f name="v${VERSION}" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')
            echo "Created release id=${RELEASE_ID}"
          fi

          # Sanity check: RELEASE_ID must be purely numeric. If it isn't, we picked
          # up an error blob somewhere and need to fail fast rather than poison
          # downstream URL construction.
          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Got non-numeric RELEASE_ID='${RELEASE_ID}' for v${VERSION}"
            exit 1
          fi
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          if gh api -X PATCH \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -F body=@release-notes.md; then
            echo "Updated release notes for v${VERSION}"
          else
            echo "::warning::Failed to update release notes for v${VERSION} (id=${RELEASE_ID}); continuing"
          fi

      - name: Ensure all installer assets are attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          if ! ls installers/* >/dev/null 2>&1; then
            echo "::error::No installer files were downloaded from the build jobs"
            exit 1
          fi
          echo "Uploading to release id=${RELEASE_ID} (v${VERSION})"

          # Build a set of names already attached so we know whether to delete-then-upload
          # (the assets API returns 422 on duplicate names; there is no PATCH).
          EXISTING=$(gh api --paginate \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | "\(.id)\t\(.name)"' || true)
          echo "Existing assets on release:"
          echo "$EXISTING"

          FILE_COUNT=$(ls -1 installers/ | wc -l)
          echo "Attaching ${FILE_COUNT} files to release id=${RELEASE_ID} (v${VERSION})..."

          # URL-encode a string for use in a query parameter (handles spaces,
          # parentheses, etc. that appear in installer names like
          # "WorkPulse Setup 1.4.63.exe"). curl rejects unencoded spaces in
          # the URL with "Malformed input to a URL function", so we have to
          # do this ourselves.
          urlencode() {
            jq -rn --arg v "$1" '$v|@uri'
          }

          FAIL=0
          for f in installers/*; do
            name=$(basename "$f")
            # Delete existing asset with same name if present (clobber behaviour).
            existing_id=$(echo "$EXISTING" | awk -F'\t' -v n="$name" '$2 == n { print $1; exit }')
            if [ -n "$existing_id" ]; then
              echo "Deleting existing asset id=${existing_id} name=${name}"
              gh api -X DELETE \
                "repos/${{ github.repository }}/releases/assets/${existing_id}" || true
            fi

            # Detect content type so GitHub serves the file correctly.
            case "$name" in
              *.yml|*.yaml) ctype="text/yaml" ;;
              *.json)       ctype="application/json" ;;
              *.exe)        ctype="application/vnd.microsoft.portable-executable" ;;
              *.dmg)        ctype="application/x-apple-diskimage" ;;
              *.zip|*.blockmap) ctype="application/zip" ;;
              *.AppImage)   ctype="application/x-executable" ;;
              *.deb)        ctype="application/vnd.debian.binary-package" ;;
              *)            ctype="application/octet-stream" ;;
            esac

            encoded_name=$(urlencode "$name")
            echo "Uploading ${name} (${ctype})..."
            # Upload directly to uploads.github.com. We use curl here (rather than
            # `gh api --hostname uploads.github.com`) because gh's Go HTTP client
            # was producing `unsupported protocol scheme ""` for the upload host —
            # it was treating the path as a relative URL. curl with an explicit
            # absolute https:// URL is unambiguous and matches what electron-builder
            # / hub / the GitHub docs all recommend.
            HTTP_CODE=$(curl -sS -o /tmp/upload-resp.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: ${ctype}" \
              --data-binary "@${f}" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${encoded_name}")
            if [ "$HTTP_CODE" != "201" ]; then
              echo "::error::Failed to upload ${name} (HTTP ${HTTP_CODE})"
              cat /tmp/upload-resp.json || true
              echo
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::One or more asset uploads failed for v${VERSION}"
            echo "Currently attached assets:"
            gh api --paginate \
              "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
              --jq '.[].name' || true
            exit 1
          fi

          echo "All assets uploaded. Final asset list on release:"
          gh api --paginate \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | {name, size, download_count}'

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Prefer gh release edit — it works directly off the tag (including drafts),
          # uses correct headers, and handles auth uniformly.
          if gh release view "v${VERSION}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Found release v${VERSION} via gh release view"
            if gh release edit "v${VERSION}" \
              --repo ${{ github.repository }} \
              --draft=false; then
              echo "Published release v${VERSION}"
              exit 0
            fi
            echo "::warning::gh release edit failed; falling back to direct API call"
          fi

          # Fallback: look up the release ID via the list endpoint (handles drafts that
          # gh release view sometimes can't see depending on token type) and PATCH via gh api.
          RELEASE_ID=$(gh api \
            "repos/${{ github.repository }}/releases" \
            --paginate \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id" | head -1)
          echo "Fallback lookup: RELEASE_ID='${RELEASE_ID}'"

          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Release v${VERSION} not found, cannot publish"
            echo "Visible releases (most recent 10):"
            gh api "repos/${{ github.repository }}/releases?per_page=10" \
              --jq '.[] | {id, tag_name, draft, name}' || true
            exit 1
          fi

          if ! gh api \
            -X PATCH \
            "repos/${{ github.repository }}/releases/${RELEASE_ID}" \
            -F draft=false; then
            echo "::error::Failed to publish release v${VERSION} (id=${RELEASE_ID})"
            echo "Token scope check (whoami):"
            gh api user --jq '.login' || true
            exit 1
          fi
          echo "Published release v${VERSION} (id=${RELEASE_ID})"