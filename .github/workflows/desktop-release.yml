name: Desktop Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0, v1.2.3

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches package.json version
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./desktop/package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  build-client:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client for Electron
        working-directory: client
        env:
          VITE_WS_URL: wss://workpulse-prod.up.railway.app/ws
          VITE_ELECTRON: 'true'
        run: npm run build

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  prepare-release:
    needs: [validate, build-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and release on releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Create the tag on WorkPulse-releases so electron-builder can publish against it
          # First check if tag already exists
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/vvronline/WorkPulse-releases/git/ref/tags/v${VERSION}")
          if [ "$STATUS" != "200" ]; then
            # Get the default branch SHA to anchor the tag
            DEFAULT_SHA=$(curl -s \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/vvronline/WorkPulse-releases/git/ref/heads/main" \
              | jq -r '.object.sha // empty')
            if [ -z "$DEFAULT_SHA" ]; then
              DEFAULT_SHA=$(curl -s \
                -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/vvronline/WorkPulse-releases/git/ref/heads/master" \
                | jq -r '.object.sha // empty')
            fi
            if [ -z "$DEFAULT_SHA" ]; then
              echo "::error::Could not find default branch SHA on WorkPulse-releases"
              exit 1
            fi
            # Create a lightweight tag
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/vvronline/WorkPulse-releases/git/refs" \
              -d "{\"ref\": \"refs/tags/v${VERSION}\", \"sha\": \"${DEFAULT_SHA}\"}"
            echo "Created tag v${VERSION} on WorkPulse-releases"
          else
            echo "Tag v${VERSION} already exists on WorkPulse-releases"
          fi

          # Build initial release notes from git log so electron-updater has content immediately
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p' || true)
          BODY="## WorkPulse Desktop v${VERSION}\n\n"
          if [ -n "$PREV_TAG" ]; then
            FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^feat" --no-merges 2>/dev/null || true)
            FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^fix" --no-merges 2>/dev/null || true)
            if [ -n "$FEATURES" ]; then BODY+="### ✨ Features\n${FEATURES}\n\n"; fi
            if [ -n "$FIXES" ]; then BODY+="### 🐛 Bug Fixes\n${FIXES}\n\n"; fi
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ]; then
              COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges 2>/dev/null | head -10 || true)
              if [ -n "$COMMITS" ]; then BODY+="### Changes\n${COMMITS}\n\n"; fi
            fi
          fi
          BODY_JSON=$(echo -e "$BODY" | jq -Rs '.')

          # Create a DRAFT release so parallel electron-builder jobs can find it and upload
          # without racing each other to create the release. The release-notes job publishes it.
          # Use gh CLI with --paginate — /releases/tags/{tag} returns 404 for draft releases,
          # and the bare list endpoint is capped at 100 results without pagination.
          EXISTING_RELEASE_ID=$(gh api \
            "repos/vvronline/WorkPulse-releases/releases" \
            --paginate \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id" | head -1)
          if [ -z "$EXISTING_RELEASE_ID" ]; then
            CREATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/vvronline/WorkPulse-releases/releases" \
              -d "{\"tag_name\": \"v${VERSION}\", \"name\": \"v${VERSION}\", \"body\": $BODY_JSON, \"draft\": true, \"prerelease\": false}")
            CREATE_HTTP_CODE=$(echo "$CREATE_RESPONSE" | tail -n1)
            if [ "$CREATE_HTTP_CODE" != "201" ]; then
              echo "::error::Failed to create release v${VERSION} on WorkPulse-releases (HTTP $CREATE_HTTP_CODE)"
              echo "$CREATE_RESPONSE" | head -n-1
              exit 1
            fi
            echo "Created draft release v${VERSION} on WorkPulse-releases with notes"
          else
            echo "Release v${VERSION} already exists on WorkPulse-releases"
          fi

  build:
    needs: [validate, build-client, prepare-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download client build
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Electron app
        working-directory: desktop
        env:
          # GH_TOKEN still set so electron-builder's `--publish always` can also upload
          # directly. The final `release-notes` job re-uploads from artifacts as a safety
          # net so a silent publish failure here can't leave the release without assets.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: npx electron-builder ${{ matrix.args }} --publish always

      - name: Generate checksums
        shell: bash
        working-directory: desktop/dist
        run: |
          echo "## Checksums (SHA-256)" > checksums.txt
          for f in *.exe *.dmg *.AppImage *.deb *.zip *.blockmap *.yml *.yaml; do
            [ -f "$f" ] && sha256sum "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.os }}
          path: desktop/dist/checksums.txt
          retention-days: 30

      - name: Stage installers for upload
        shell: bash
        working-directory: desktop/dist
        run: |
          # Collect only the files that need to be on the GitHub release. We deliberately
          # exclude the unpacked app bundles (linux-unpacked/, win-unpacked/, mac/, etc.)
          # which are huge and not needed by electron-updater.
          mkdir -p ../../release-assets/${{ matrix.os }}
          shopt -s nullglob
          for f in *.exe *.exe.blockmap \
                   *.dmg *.dmg.blockmap *.zip *.zip.blockmap \
                   *.AppImage *.deb \
                   latest.yml latest-mac.yml latest-linux.yml; do
            if [ -f "$f" ]; then
              cp "$f" "../../release-assets/${{ matrix.os }}/"
              echo "Staged: $f"
            fi
          done
          echo "---"
          echo "Total staged files:"
          ls -la "../../release-assets/${{ matrix.os }}/"

      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: release-assets/${{ matrix.os }}/
          retention-days: 7
          if-no-files-found: error

  release-notes:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all checksums
        uses: actions/download-artifact@v4
        with:
          pattern: checksums-*
          path: checksums

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Find previous tag
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '2p')
          
          NOTES="## WorkPulse Desktop v${VERSION}\n\n"
          
          if [ -n "$PREV_TAG" ]; then
            NOTES+="### Changes since ${PREV_TAG}\n\n"
            # Group commits by type
            FEATURES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^feat" --no-merges 2>/dev/null || true)
            FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --grep="^fix" --no-merges 2>/dev/null || true)
            OTHER=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --invert-grep --grep="^feat" --grep="^fix" --no-merges 2>/dev/null | head -20 || true)
            
            if [ -n "$FEATURES" ]; then
              NOTES+="### ✨ Features\n${FEATURES}\n\n"
            fi
            if [ -n "$FIXES" ]; then
              NOTES+="### 🐛 Bug Fixes\n${FIXES}\n\n"
            fi
            if [ -n "$OTHER" ]; then
              NOTES+="### 📝 Other Changes\n${OTHER}\n\n"
            fi
          fi
          
          # Append checksums
          NOTES+="### 🔒 Checksums (SHA-256)\n\`\`\`\n"
          for f in checksums/checksums-*/checksums.txt; do
            if [ -f "$f" ]; then
              NOTES+="$(cat "$f")\n"
            fi
          done
          NOTES+="\`\`\`\n"
          
          # Write to file for the GitHub release
          echo -e "$NOTES" > release-notes.md
          cat release-notes.md

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: List downloaded installers
        run: |
          echo "Files staged for upload to v${{ needs.validate.outputs.version }}:"
          ls -la installers/ || true
          echo "Total size:"
          du -sh installers/ || true

      - name: Update release notes on releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Use gh CLI throughout — it sets the correct Accept/User-Agent/auth headers,
          # handles pagination, and gives clearer errors than hand-rolled curl PATCHes.
          # /releases/tags/{tag} only returns published releases, so we list (paginated)
          # to find drafts too.
          RELEASE_ID=$(gh api \
            "repos/vvronline/WorkPulse-releases/releases" \
            --paginate \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id" | head -1)
          echo "Lookup result for v${VERSION}: RELEASE_ID='${RELEASE_ID}'"

          if [ -n "$RELEASE_ID" ]; then
            # gh api -F reads the body from a file and JSON-encodes it correctly.
            if gh api \
              -X PATCH \
              "repos/vvronline/WorkPulse-releases/releases/${RELEASE_ID}" \
              -F body=@release-notes.md; then
              echo "Updated release notes for v${VERSION}"
            else
              echo "::warning::Failed to update release notes for v${VERSION} (id=${RELEASE_ID}); continuing"
            fi
          else
            echo "Release v${VERSION} not found yet, skipping notes update"
          fi

      - name: Ensure all installer assets are attached to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Safety net: even if electron-builder's --publish always failed silently in
          # one of the matrix jobs, this step guarantees every required installer file
          # is attached to the release. --clobber overwrites any existing asset of the
          # same name (no-op if file is identical to what was uploaded earlier).
          if ! ls installers/* >/dev/null 2>&1; then
            echo "::error::No installer files were downloaded from the build jobs"
            exit 1
          fi

          echo "Attaching $(ls installers/ | wc -l) files to v${VERSION}..."
          # Use gh release upload — it handles the multipart upload to the GitHub
          # uploads endpoint correctly (different host than api.github.com).
          if ! gh release upload "v${VERSION}" \
              --repo vvronline/WorkPulse-releases \
              --clobber \
              installers/*; then
            echo "::error::Failed to upload one or more assets to release v${VERSION}"
            echo "Currently attached assets:"
            gh release view "v${VERSION}" --repo vvronline/WorkPulse-releases \
              --json assets --jq '.assets[].name' || true
            exit 1
          fi

          echo "All assets uploaded. Final asset list on release:"
          gh release view "v${VERSION}" --repo vvronline/WorkPulse-releases \
            --json assets --jq '.assets[] | {name, size, downloadCount}'

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # Prefer gh release edit — it works directly off the tag (including drafts),
          # uses correct headers, and handles auth uniformly.
          if gh release view "v${VERSION}" --repo vvronline/WorkPulse-releases >/dev/null 2>&1; then
            echo "Found release v${VERSION} via gh release view"
            if gh release edit "v${VERSION}" \
              --repo vvronline/WorkPulse-releases \
              --draft=false; then
              echo "Published release v${VERSION}"
              exit 0
            fi
            echo "::warning::gh release edit failed; falling back to direct API call"
          fi

          # Fallback: look up the release ID via the list endpoint (handles drafts that
          # gh release view sometimes can't see depending on token type) and PATCH via gh api.
          RELEASE_ID=$(gh api \
            "repos/vvronline/WorkPulse-releases/releases" \
            --paginate \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | .id" | head -1)
          echo "Fallback lookup: RELEASE_ID='${RELEASE_ID}'"

          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Release v${VERSION} not found, cannot publish"
            echo "Visible releases on WorkPulse-releases (most recent 10):"
            gh api "repos/vvronline/WorkPulse-releases/releases?per_page=10" \
              --jq '.[] | {id, tag_name, draft, name}' || true
            exit 1
          fi

          if ! gh api \
            -X PATCH \
            "repos/vvronline/WorkPulse-releases/releases/${RELEASE_ID}" \
            -F draft=false; then
            echo "::error::Failed to publish release v${VERSION} (id=${RELEASE_ID})"
            echo "Token scope check (whoami):"
            gh api user --jq '.login' || true
            exit 1
          fi
          echo "Published release v${VERSION} (id=${RELEASE_ID})"
