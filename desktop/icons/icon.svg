<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f1a"/>
      <stop offset="50%" stop-color="#111832"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </linearGradient>
    <!-- Core star -->
    <radialGradient id="core" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <!-- Core outer glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- Orbit arc gradients -->
    <linearGradient id="arc1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="arc2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="arc3" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="35%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Planet gradients -->
    <radialGradient id="pCyan" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="pPurple" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="pGreen" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <!-- Filters -->
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Glass panel -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle inner edge highlight -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="url(#glass)" stroke-width="1.5"/>

  <!-- Ambient glow behind everything -->
  <circle cx="256" cy="256" r="140" fill="#0ea5e9" opacity="0.03" filter="url(#glow3)"/>

  <!-- Orbit arc 1 — cyan/blue, sweeping upper-right -->
  <path d="M 145 310 A 148 62 -18 0 1 390 198" fill="none" stroke="url(#arc1)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow1)"/>
  <!-- Ghost echo -->
  <path d="M 145 310 A 148 62 -18 0 1 390 198" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 8"/>

  <!-- Orbit arc 2 — purple/pink, sweeping lower-left -->
  <path d="M 370 310 A 165 70 15 0 1 110 225" fill="none" stroke="url(#arc2)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow1)"/>
  <path d="M 370 310 A 165 70 15 0 1 110 225" fill="none" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="4 8"/>

  <!-- Orbit arc 3 — green/teal, wide sweep bottom -->
  <path d="M 170 175 A 190 85 -10 0 0 380 290" fill="none" stroke="url(#arc3)" stroke-width="2" stroke-linecap="round" filter="url(#glow1)"/>
  <path d="M 170 175 A 190 85 -10 0 0 380 290" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.1" stroke-dasharray="3 10"/>

  <!-- Central star — outer glow layers -->
  <circle cx="256" cy="252" r="70" fill="url(#coreGlow)" filter="url(#glow3)"/>
  <circle cx="256" cy="252" r="42" fill="url(#coreGlow)"/>
  <!-- Central star — solid -->
  <circle cx="256" cy="252" r="26" fill="url(#core)" filter="url(#glow2)"/>
  <!-- Specular highlight -->
  <ellipse cx="250" cy="244" rx="10" ry="8" fill="#fff" opacity="0.45"/>

  <!-- Planet 1 — Cyan, on arc 1 -->
  <circle cx="340" cy="205" r="16" fill="url(#pCyan)" filter="url(#glow1)"/>
  <ellipse cx="336" cy="200" rx="6" ry="4.5" fill="#fff" opacity="0.3"/>
  <!-- Tiny ring -->
  <ellipse cx="340" cy="205" rx="24" ry="6" fill="none" stroke="#67e8f9" stroke-width="1.2" stroke-opacity="0.35" transform="rotate(-25, 340, 205)"/>

  <!-- Planet 2 — Purple, on arc 2 -->
  <circle cx="155" cy="240" r="13" fill="url(#pPurple)" filter="url(#glow1)"/>
  <ellipse cx="152" cy="236" rx="5" ry="3.5" fill="#fff" opacity="0.3"/>

  <!-- Planet 3 — Green, on arc 3 -->
  <circle cx="355" cy="282" r="11" fill="url(#pGreen)" filter="url(#glow1)"/>
  <ellipse cx="352" cy="279" rx="4" ry="3" fill="#fff" opacity="0.25"/>
  <!-- Moon -->
  <circle cx="369" cy="274" r="3.5" fill="#fde68a" opacity="0.7" filter="url(#glow1)"/>

  <!-- Decorative dots — tiny distant stars -->
  <circle cx="92" cy="105" r="1.2" fill="#fff" opacity="0.2"/>
  <circle cx="415" cy="78" r="1" fill="#fff" opacity="0.15"/>
  <circle cx="78" cy="380" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="430" cy="410" r="1.2" fill="#fff" opacity="0.15"/>
  <circle cx="180" cy="72" r="0.8" fill="#06b6d4" opacity="0.3"/>
  <circle cx="400" cy="160" r="0.8" fill="#a855f7" opacity="0.25"/>
  <circle cx="115" cy="420" r="0.8" fill="#10b981" opacity="0.25"/>
  <circle cx="360" cy="430" r="0.8" fill="#fbbf24" opacity="0.2"/>

  <!-- Pulse rings from center — the "Pulse" in WorkPulse -->
  <circle cx="256" cy="252" r="50" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.08"/>
  <circle cx="256" cy="252" r="80" fill="none" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.04"/>

  <!-- Glass overlay panel — top-left corner reflection -->
  <path d="M 30 200 Q 30 30 200 30 L 160 30 Q 30 30 30 160 Z" fill="#fff" opacity="0.015"/>
</svg>