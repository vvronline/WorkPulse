appId: com.workpulse.desktop
productName: WorkPulse
copyright: Copyright © 2026 WorkPulse

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - tray.js
  - updater.js
  - callPipWindow.js
  - biometric.js
  - icons/**/*
  - package.json
  - google-api-key.txt

extraResources:
  - from: ../client/dist
    to: client/dist
    filter:
      - "**/*"
  # NOTE: we deliberately do NOT duplicate google-api-key.txt into
  # extraResources. The file is already packaged inside the asar via the
  # `files:` array above, and Electron's asar shim lets main.js read it
  # via `path.join(__dirname, 'google-api-key.txt')`. Adding an explicit
  # `from: google-api-key.txt` entry here would make local dev builds
  # (and CI builds without the GOOGLE_API_KEY secret) fail with
  # "ENOENT: google-api-key.txt" because electron-builder treats missing
  # extraResources source files as a hard error.

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icons/icon.ico
  publisherName: WorkPulse
  # TODO: Enable once code signing certificate is set up.
  # Without code signing, Windows SmartScreen will warn users on install.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WorkPulse
  artifactName: "${productName}-Setup-${version}.${ext}"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: icons/icon.png
  category: public.app-category.business

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
    - target: deb
  icon: icons
  category: Office

publish:
  provider: github
  owner: vvronline
  repo: WorkPulse
  releaseType: release
