services:
  postgres:
    image: postgres:16
    container_name: workpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workpulse
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: workpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - workpulse-network

  workpulse:
    build: .
    container_name: workpulse-app
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://workpulse:workpulse@postgres:5432/workpulse
      # The JWT Secret MUST be defined in a .env file to be passed exactly. Default supplied here for clarity.
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_jwt_key_here}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      # Email SMTP settings (Optional)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      # Map the avatar uploads folder to the host system
      - ./server/uploads:/app/server/uploads
    networks:
      - workpulse-network

volumes:
  pgdata:

networks:
  workpulse-network:
    driver: bridge