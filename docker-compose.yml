services:
  postgres:
    image: postgres:16
    container_name: workpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workpulse
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - workpulse-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulse -d workpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: workpulse-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}
    volumes:
      - ./data/redis:/data
    networks:
      - workpulse-internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  workpulse:
    build: .
    container_name: workpulse-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - USE_HTTPS=false
      - DATABASE_URL=postgresql://workpulse:${DB_PASSWORD:?DB_PASSWORD is required in .env}@postgres:5432/workpulse
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}@redis:6379
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
    volumes:
      - ./server/uploads:/app/server/uploads
    networks:
      - workpulse-internal

  caddy:
    image: caddy:2-alpine
    container_name: workpulse-caddy
    restart: unless-stopped
    depends_on:
      - workpulse
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - workpulse-internal
      - workpulse-external

volumes:
  caddy_data:
  caddy_config:

networks:
  workpulse-internal:
    driver: bridge
    internal: true
  workpulse-external:
    driver: bridge