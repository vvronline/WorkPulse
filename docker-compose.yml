services:
  postgres:
    image: postgres:16
    container_name: workpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workpulse
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workpulse}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - workpulse-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulse -d workpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  workpulse:
    build: .
    container_name: workpulse-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://workpulse:${DB_PASSWORD:-workpulse}@postgres:5432/workpulse
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - ./server/uploads:/app/server/uploads
    networks:
      - workpulse-internal

networks:
  workpulse-internal:
    driver: bridge
    internal: false