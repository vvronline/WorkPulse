services:
  postgres:
    image: postgres:16
    container_name: workpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: workpulse
      POSTGRES_USER: workpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - workpulse-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workpulse -d workpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: workpulse-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}
    volumes:
      - ./data/redis:/data
    networks:
      - workpulse-internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  workpulse:
    build: .
    container_name: workpulse-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - USE_HTTPS=false
      - DATABASE_URL=postgresql://workpulse:${DB_PASSWORD:?DB_PASSWORD is required in .env}@postgres:5432/workpulse
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in .env}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in .env}@redis:6379
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID:-}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      # A3 — object storage. Defaults to `local` so this compose stack works
      # offline with no R2 credentials; set STORAGE_DRIVER=r2 (plus the R2_*
      # vars) to exercise the production path.
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_UPLOADS_BUCKET=${R2_UPLOADS_BUCKET:-aino-uploads}
      # H — observability. Unset by default: /metrics is open on this internal
      # network, and tracing stays off until an OTLP collector is configured.
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - METRICS_TENANT_TOP_N=${METRICS_TENANT_TOP_N:-20}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      # Only used by STORAGE_DRIVER=local. With STORAGE_DRIVER=r2 the container
      # is fully stateless and this mount can be deleted.
      - ./server/uploads:/app/server/uploads
    networks:
      - workpulse-internal

  caddy:
    image: caddy:2-alpine
    container_name: workpulse-caddy
    restart: unless-stopped
    depends_on:
      - workpulse
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - workpulse-internal
      - workpulse-external

volumes:
  caddy_data:
  caddy_config:

networks:
  workpulse-internal:
    driver: bridge
    internal: true
  workpulse-external:
    driver: bridge