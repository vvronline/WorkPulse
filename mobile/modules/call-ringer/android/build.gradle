apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.callringer'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "expo.modules.callringer"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // NotificationCompat.CallStyle (branded green Answer / red Decline buttons)
  // requires androidx.core 1.7.0+. Pin a version that ships CallStyle so the
  // incoming-call notification renders the system call template reliably.
  implementation "androidx.core:core-ktx:${safeExtGet('androidXCoreVersion', '1.13.1')}"
}
